name: OpenWrt-CI2

on:
  workflow_dispatch:
    inputs:
      tag:
        description: '指定源码的分支、Tag 或 Commit (例如: openwrt-23.05 或 master)'
        required: true
        default: 'openwrt-23.05'

permissions:
  contents: read

jobs:

  build_openwrt:

    name: Build OpenWrt Firmware

    runs-on: ubuntu-22.04

    steps:
      - name: Space cleanup and Initialization environment
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          docker image prune -f
          sudo -E rm -rf /usr/share/dotnet /etc/mysql /etc/php /etc/apt/sources.list.d /usr/local/lib/android
          sudo -E apt-mark hold grub-efi-amd64-signed
          sudo -E apt update
          sudo -E apt -y purge azure-cli* docker* ghc* zulu* llvm* firefox google* dotnet* powershell* openjdk* mysql* php* mongodb* dotnet* snap*
          sudo -E apt -y full-upgrade
          sudo -E apt -y install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache clang cmake cpio curl device-tree-compiler flex gawk gcc-multilib g++-multilib gettext genisoimage git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool llvm lrzsz msmtp ninja-build p7zip p7zip-full patch pkgconf python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
          sudo -E systemctl daemon-reload
          sudo -E apt -y autoremove --purge
          sudo -E apt clean
          sudo -E timedatectl set-timezone "Asia/Shanghai"

      - name: Checkout OpenWrt
        uses: actions/checkout@v4
        with:
          repository: openwrt/openwrt
          ref: ${{ github.event.inputs.tag || 'openwrt-23.05' }}
          fetch-depth: 0

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Add custom packages & Update feeds
        run: |
          mkdir -p package/custom
          cd package/custom

          # 1. 克隆 SmartDNS 及其 LuCI
          git clone https://github.com/pymumu/openwrt-smartdns.git smartdns
          git clone https://github.com/pymumu/luci-app-smartdns.git luci-app-smartdns

          # 2. 克隆 PassWall 及其依赖包
          git clone https://github.com/xiaorouji/openwrt-passwall-packages.git passwall-packages
          git clone https://github.com/xiaorouji/openwrt-passwall.git passwall

          # 3. 克隆 KMS (vlmcsd) 及其 LuCI
          git clone https://github.com/Wind4/vlmcsd.git
          git clone https://github.com/cjxb/luci-app-vlmcsd.git

          cd ../..
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Inject Configuration (ESXi x86_64, SmartDNS, PassWall, KMS)
        run: |
          cat << 'EOF' > .config
          # 架构目标设置：x86_64
          CONFIG_TARGET_x86=y
          CONFIG_TARGET_x86_64=y
          CONFIG_TARGET_x86_64_DEVICE_generic=y

          # ESXi / VMware 虚拟化相关驱动与镜像选项
          CONFIG_TARGET_IMAGES_PAD=y
          CONFIG_VMDK_IMAGES=y
          CONFIG_PACKAGE_kmod-vmxnet3=y
          CONFIG_PACKAGE_kmod-e1000e=y
          CONFIG_PACKAGE_kmod-open-vm-tools=y

          # 基础组件与 LuCI 界面
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y

          # 选中的目标插件及其依赖
          CONFIG_PACKAGE_smartdns=y
          CONFIG_PACKAGE_luci-app-smartdns=y

          CONFIG_PACKAGE_luci-app-passwall=y
          CONFIG_PACKAGE_luci-app-passwall_Iptables_Transparent_Proxy=y

          CONFIG_PACKAGE_vlmcsd=y
          CONFIG_PACKAGE_luci-app-vlmcsd=y
          EOF

          make defconfig

      - name: Download packages
        run: make download -j16

      - name: Compile firmware
        run: |
          make -j$(nproc) || make -j1 V=s
          echo "======================="
          echo "Space usage:"
          echo "======================="
          df -h
          echo "======================="
          du -h --max-depth=1 ./ --exclude=build_dir --exclude=bin
          du -h --max-depth=1 ./build_dir
          du -h --max-depth=1 ./bin

      - name: Prepare artifact
        run: |
          mkdir -p ./artifact/package
          mkdir -p ./artifact/buildinfo
          mkdir -p ./artifact/firmware
          
          # 收集编译产物
          rm -rf $(find ./bin/targets/ -type d -name "packages")
          cp -rf $(find ./bin/packages/ -type f -name "*.ipk") ./artifact/package/ 2>/dev/null || true
          cp -rf $(find ./bin/targets/ -type f -name "*.buildinfo" -o -name "*.manifest") ./artifact/buildinfo/ 2>/dev/null || true
          
          # 筛选包含 vmdk/img 固件镜像
          cp -rf $(find ./bin/targets/ -type f \( -name "*.vmdk" -o -name "*.img.gz" -o -name "*.img" \)) ./artifact/firmware/ 2>/dev/null || true

      - name: Upload buildinfo
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_buildinfo
          path: ./artifact/buildinfo/

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_package
          path: ./artifact/package/

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: OpenWrt_firmware
          path: ./artifact/firmware/
